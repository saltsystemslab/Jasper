<svg xmlns="http://www.w3.org/2000/svg" viewBox="44 12 508 200" width="508" height="200" role="img" aria-label="Jasper">
  <title>Jasper</title>
  <desc>Three mountain peaks with ridge lines, above two lake lines, beneath a four-star constellation connected in a chain, set on a soft gray card for dark backgrounds.</desc>

  <defs>
    <linearGradient id="jasperCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ECEAE6"/>
      <stop offset="1" stop-color="#D7D4CE"/>
    </linearGradient>
  </defs>

  <!-- gray card so the dark ink stays legible on dark-mode pages -->
  <rect x="44" y="12" width="508" height="200" rx="24" ry="24" fill="url(#jasperCard)"/>
  <rect x="44.5" y="12.5" width="507" height="199" rx="23.5" ry="23.5" fill="none" stroke="#1C1B19" stroke-width="1" opacity="0.1"/>

  <polygon points="208,175 240,128 276,175" fill="#1C1B19" opacity="0.5"/>
  <polygon points="62,175 108,118 152,175" fill="#1C1B19" opacity="0.72"/>
  <polygon points="124,175 172,80 228,175" fill="#1C1B19"/>

  <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <path d="M172 80 L188 128 L183 175" stroke-width="1.6" opacity="0.8"/>
    <path d="M172 80 L159 114" stroke-width="1.2" opacity="0.5"/>
    <path d="M144 140 L155 159" stroke-width="1.2" opacity="0.5"/>
    <path d="M199 150 L209 167" stroke-width="1.2" opacity="0.5"/>
    <path d="M108 118 L118 152 L114 175" stroke-width="1.4" opacity="0.68"/>
    <path d="M240 128 L247 156" stroke-width="1.3" opacity="0.68"/>
  </g>

  <line x1="56" y1="187" x2="282" y2="187" stroke="#1C1B19" stroke-width="2.5" opacity="0.3"/>
  <line x1="84" y1="198" x2="254" y2="198" stroke="#1C1B19" stroke-width="2.5" opacity="0.2"/>

  <g fill="none" stroke="#D85A30" stroke-width="1.4" stroke-linecap="round">
    <path d="M98 58 L140 32"/>
    <path d="M140 32 L190 50"/>
    <path d="M190 50 L232 34"/>
  </g>
  <circle cx="98" cy="58" r="3.5" fill="#D85A30"/>
  <circle cx="140" cy="32" r="4.8" fill="#D85A30"/>
  <circle cx="190" cy="50" r="3.8" fill="#D85A30"/>
  <circle cx="232" cy="34" r="3.2" fill="#D85A30"/>
  <text x="330" y="128" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="56" font-weight="500" letter-spacing="-1.5" fill="#1C1B19">Jasper</text>
  <text x="334" y="158" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="1.6" fill="#6E6C66">GPU-native vector search</text>
</svg>
